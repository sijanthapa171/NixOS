<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- NixOS Snowflake / Lambda-style logo, Catppuccin Mauve coloured -->
  <g fill="#cba6f7">
    <!-- Center hexagon formed by 6 lambda-like arms -->
    <!-- Top arm -->
    <polygon points="50,5 57,18 43,18" />
    <!-- Top-right arm -->
    <polygon points="82,18 82,33 70,26" />
    <!-- Bottom-right arm -->
    <polygon points="82,82 70,74 82,67" />
    <!-- Bottom arm -->
    <polygon points="50,95 43,82 57,82" />
    <!-- Bottom-left arm -->
    <polygon points="18,82 18,67 30,74" />
    <!-- Top-left arm -->
    <polygon points="18,18 30,26 18,33" />
    <!-- Center hexagon -->
    <polygon points="50,30 64,38 64,62 50,70 36,62 36,38" />
    <!-- Inner cutout (dark) -->
    <polygon points="50,40 58,45 58,55 50,60 42,55 42,45" fill="#1e1e2e" />
  </g>
</svg>
